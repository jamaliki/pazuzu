[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pazuzu-ssh"
version = "0.1.0"
description = "A small self-healing OpenSSH gateway for agents and local tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Kiarash Jamali"}]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.28.1,<2"]
dev = ["ruff>=0.12,<1"]

[project.scripts]
pazuzu = "pazuzu.cli:main"
pazuzu-mcp = "pazuzu.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
